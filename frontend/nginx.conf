server {
    listen 80;

    # La página: archivos HTML, CSS y JavaScript.
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Todo lo que empiece por /api/ se reenvía al contenedor del backend.
    # Así la página y la API salen de la misma dirección y el navegador no
    # pone problemas de CORS. "backend" es el nombre del servicio en
    # docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000;
    }
}
